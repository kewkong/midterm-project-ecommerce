<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Products</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous" />
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css" />
  </head>
  <body>
    <!-- NOTE: ส่วนของ navbar -->
    <nav class="navbar navbar-expand-lg bg-body-tertiary">
      <div class="container-md">
        <a class="navbar-brand" href="index.html">Umami Meaw</a>

        <div class="d-flex align-items-center gap-3 order-lg-last">
          <a href="cart.html" class="text-reset text-decoration-none position-relative">
            <i class="bi bi-bag fs-5"></i>

            <span id="cart-badge" class="position-absolute top-0 start-100 translate-middle badge rounded-pill bg-danger" style="font-size: 0.65em"> 0 <span class="visually-hidden">items in cart</span> </span>
          </a>

          <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
          </button>
        </div>

        <div class="collapse navbar-collapse mx-4" id="navbarSupportedContent">
          <ul class="navbar-nav me-auto mb-2 mb-lg-0">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="index.html">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link active" href="products.html">Products</a>
            </li>
          </ul>
        </div>
      </div>
    </nav>

    <!-- ส่วนของรายละเอียดสินค้า -->
    <div class="container py-5">
      <h5 class="mb-4">ตะกร้าสินค้าของคุณ</h5>

      <div class="table-responsive">
        <table class="table table-hover align-middle">
          <thead class="table-light">
            <tr>
              <th>สินค้า</th>
              <th>ราคาต่อชิ้น</th>
              <th style="width: 150px">จำนวน</th>
              <th>รวม</th>
              <th>จัดการ</th>
            </tr>
          </thead>
          <!-- NOTE: สร้างtbodyเตรียมรับโค้ดแต่ละrow เข้ามาจาก script -->
          <tbody id="cart-table-body"></tbody>
        </table>
      </div>

      <div class="d-flex justify-content-end mt-3">
        <h4>ยอดรวมทั้งสิ้น: <span id="cart-total" class="text-danger fw-bold">฿0</span></h4>
      </div>

      <div class="d-flex justify-content-between align-items-center mt-4 border-top pt-4">
        <a href="products.html" class="btn btn-outline-secondary"> <i class="bi bi-arrow-left"></i> เลือกซื้อสินค้าต่อ </a>

        <button id="checkout-btn" class="btn btn-success btn-lg px-5">ดำเนินการชำระเงิน <i class="bi bi-arrow-right"></i></button>
      </div>
    </div>

    <!-- NOTE:ส่วนของ Content -->
    <script>
      // ฟังก์ชันจัดการปุ่ม Checkout โดยจะทำงานเมื่อคลิ๊กปุ่ม checkout-btn
      document.getElementById("checkout-btn").addEventListener("click", function () {
        let cart = JSON.parse(localStorage.getItem("myCart")) || [];

        // 1. เช็คว่าตะกร้าว่างหรือไม่
        if (cart.length === 0) {
          alert("ตะกร้าสินค้าของคุณว่างเปล่า กรุณาเลือกซื้อสินค้าก่อนครับ");
          return; // หยุดการทำงาน ไม่ให้เปลี่ยนหน้า
        }

        // 2. ถ้ามีสินค้า ให้ Redirect ไปที่หน้า Checkout
        window.location.href = "checkout.html";
      });

      // ฟังก์ชันหลักสำหรับดึงข้อมูลมาแสดงในตาราง
      function loadCartTable() {
        let cart = JSON.parse(localStorage.getItem("myCart")) || [];
        let tableBody = document.getElementById("cart-table-body");
        let cartTotalDisplay = document.getElementById("cart-total");

        // ล้างข้อมูลเก่า
        tableBody.innerHTML = "";
        let totalPrice = 0;

        // ถ้าไม่มีสินค้า
        if (cart.length === 0) {
          tableBody.innerHTML = '<tr><td colspan="5" class="text-center text-muted py-4">ไม่มีสินค้าในตะกร้า</td></tr>';
          cartTotalDisplay.innerText = "฿0";
          return;
        }

        // วนลูปสร้างแถวตาราง
        cart.forEach((item, index) => {
          // คำนวณยอดเงินของแต่ละรายการ
          let itemTotal = item.price * item.quantity;
          // คำนวนผลรวมทุกรายการ โดยเอาผลรวมแต่ละรายการมาบวกเพิ่มจาก loop forEach
          totalPrice += itemTotal;

          // สร้าง <tr></tr>
          let tr = document.createElement("tr");
          // กำหนดโค้ด html ในแท้ก tr
          // ในคอลัมของจำนวน มีการใส่ onchange เพื่อเรียกใช้ฟังชั่น updateQuantity เวลาเปลี่ยนแปรงตัวเลข
          tr.innerHTML = `
                  <td><h6 class="mb-0">${item.name}</h6></td>
                  <td>฿${item.price}</td>
                  <td>
                      <input type="number" class="form-control form-control-sm text-center" 
                            value="${item.quantity}" min="1" 
                            onchange="updateQuantity(${index}, this.value)">
                  </td>
                  <td class="fw-bold">฿${itemTotal}</td>
                  <td>
                      <button class="btn btn-sm btn-outline-danger" onclick="removeItem(${index})">
                          <i class="bi bi-trash"></i> ลบ
                      </button>
                  </td>
              `;
          // เอา tag tr ที่สร้างเข้าไปเป็นลูกของ tableBody Element
          tableBody.appendChild(tr);
        });

        // อัปเดตยอดรวม
        cartTotalDisplay.innerText = `฿${totalPrice}`;
      }

      // 1. ฟังก์ชันเปลี่ยนจำนวนสินค้า (เพิ่มการเรียก updateCartBadge)
      function updateQuantity(index, newQuantity) {
        let cart = JSON.parse(localStorage.getItem("myCart")) || [];
        let qty = parseInt(newQuantity);

        if (qty > 0) {
          cart[index].quantity = qty;
          localStorage.setItem("myCart", JSON.stringify(cart));

          loadCartTable(); // อัปเดตตัวเลขในตารางและยอดรวม
          updateCartBadge(); // ทำให้อัปเดทตัวเลขในตะกร้าที่ nav
        }
      }

      // 2. ฟังก์ชันลบสินค้า (เพิ่มการเรียก updateCartBadge)
      function removeItem(index) {
        let cart = JSON.parse(localStorage.getItem("myCart")) || [];

        cart.splice(index, 1);
        localStorage.setItem("myCart", JSON.stringify(cart));

        loadCartTable(); // อัปเดตตัวเลขในตารางและยอดรวม
        updateCartBadge(); // ทำให้อัปเดทตัวเลขในตะกร้าที่ nav
      }

      // 3. ฟังก์ชันอัปเดตตัวเลขบนไอคอนตะกร้า (ทบทวนโค้ดเดิม)
      function updateCartBadge() {
        let cart = JSON.parse(localStorage.getItem("myCart")) || [];
        // ใช้ reduce เพื่อรวมจำนวน (quantity) ของสินค้าทุกชิ้น
        let totalItems = cart.reduce((sum, item) => sum + item.quantity, 0);

        let badge = document.getElementById("cart-badge");
        if (badge) {
          badge.innerText = totalItems;
          // ถ้าเป็น 0 อาจจะเลือกซ่อน badge เพื่อความสวยงาม
          badge.style.display = totalItems === 0 ? "none" : "inline-block";
        }
      }

      // สั่งให้ฟังก์ชันทำงานทันทีที่เปิดหน้านี้
      loadCartTable();
      updateCartBadge();
    </script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
  </body>
</html>
